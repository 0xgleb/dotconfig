name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches-ignore: ["graphite-base/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - run: nix --no-pure-eval flake check

      - name: Typecheck Pi extensions
        timeout-minutes: 10
        run: |
          nix --accept-flake-config --no-pure-eval develop .#default --command bash -euo pipefail -c '
            cd ai/pi/extensions
            npm ci --legacy-peer-deps --include=dev
            npm run typecheck
          '

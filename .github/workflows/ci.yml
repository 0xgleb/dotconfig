name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build --no-link .#checks.x86_64-linux.stop-check .#checks.x86_64-linux.unicode-check .#checks.x86_64-linux.md-sync .#checks.x86_64-linux.mdup

  build-nixos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build .#nixosConfigurations.nixxxos.config.system.build.toplevel

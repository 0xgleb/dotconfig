[project]
name = "infra"
revision = "1.0"

[profiles.default]
TS_AUTHKEY = { description = "Tailscale auth key for joining new nodes to the tailnet on first boot. Generate at https://login.tailscale.com/admin/settings/keys (single-use, pre-approved, persistent).", required = false, as_path = true }

